name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build mod
        shell: powershell
        run: |
          ./tools/Build-NativeBridge.ps1 -Compiler C:/msys64/mingw64/bin/g++.exe
          ./tools/Build-LanDirect.ps1
      - name: Package release
        shell: powershell
        run: |
          ./tools/Package-LanDirect.ps1
          ./tools/Package-NativeBridge.ps1
      - name: Test installer in isolated fixtures
        shell: powershell
        run: ./tests/Test-Installer.ps1
      - name: Test native installer in isolated fixtures
        shell: powershell
        run: ./tests/Test-NativeBridgeInstaller.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LanDirect-windows
          path: |
            artifacts/LanDirect-*-windows.zip
            artifacts/NativeBridge-*-windows.zip
            artifacts/SHA256SUMS.txt
